[project]
name = "catalogue-pipeline"
version = "0.1.0"
description = "Checks and imports Shopify storefronts for The Catalogue. Standard library only, no database."
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
catalogue-check = "catalogue_pipeline.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalogue_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
